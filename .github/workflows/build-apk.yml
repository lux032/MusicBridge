name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available in the SDK repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Never expose the Release signing key to pull request builds.
      - name: Restore Release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # The repository's gradlew is not executable; invoke it through bash.
      # Pull requests keep the existing debug-signing fallback.
      - name: Run unit tests and build Debug / Release APKs
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            for name in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing signing setting: $name"
                exit 1
              fi
            done
          fi
          bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain --stacktrace

      - name: Clean up Release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare downloadable APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/MusicBridge-debug-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/MusicBridge-release-${GITHUB_RUN_NUMBER}.apk"
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MusicBridge-apks-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: MusicBridge-release-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed test APK
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: MusicBridge-apks-${{ github.run_number }}
          path: artifacts

      - name: Publish directly installable Release APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="test-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          apk="MusicBridge-release-${GITHUB_RUN_NUMBER}.apk"
          (cd artifacts && sha256sum "$apk" > RELEASE-SHA256SUMS.txt)
          notes="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' \
            '## 正式签名测试包' \
            '' \
            '直接下载下方 Release APK 即可安装，无需解压。此预发布使用正式签名，但不代表稳定版本。' \
            '' \
            "- 源分支/标签：\`${GITHUB_REF_NAME}\`" \
            "- 提交：\`${GITHUB_SHA}\`" \
            "- 构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '' \
            '覆盖安装需要已有应用使用相同签名；应用版本号沿用源码配置。' \
            > "$notes"
          gh release create "$tag" \
            "artifacts/$apk" \
            artifacts/RELEASE-SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "测试构建 #${GITHUB_RUN_NUMBER}（${GITHUB_REF_NAME}，第 ${GITHUB_RUN_ATTEMPT} 次运行）" \
            --notes-file "$notes" \
            --prerelease \
            --latest=false
          {
            echo '### 正式签名测试 APK'
            echo "- [直接下载 APK](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${apk})"
            echo "- [查看测试 Release](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag})"
          } >> "$GITHUB_STEP_SUMMARY"
