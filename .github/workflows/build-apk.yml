name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer available in the SDK repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Never expose the Release signing key to pull request builds.
      - name: Restore Release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # The repository's gradlew is not executable; invoke it through bash.
      # Pull requests keep the existing debug-signing fallback.
      - name: Run unit tests and build Debug / Release APKs
        env:
          KEYSTORE_FILE: ${{ github.event_name != 'pull_request' && format('{0}/release.keystore', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            for name in KEYSTORE_FILE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing signing setting: $name"
                exit 1
              fi
            done
          fi
          bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --console=plain --stacktrace

      - name: Clean up Release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare downloadable APKs
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/MusicBridge-debug-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "artifacts/MusicBridge-release-${GITHUB_RUN_NUMBER}.apk"
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MusicBridge-apks-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release obfuscation mapping
        uses: actions/upload-artifact@v4
        with:
          name: MusicBridge-release-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
